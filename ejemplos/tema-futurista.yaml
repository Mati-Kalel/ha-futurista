# Tema opcional: pinta el fondo, la barra superior y los menús de Home Assistant
# con los mismos colores que las tarjetas.
# 1) Copia este archivo a /config/themes/tema-futurista.yaml
# 2) En configuration.yaml agrega (si no lo tienes):
#      frontend:
#        themes: !include_dir_merge_named themes
# 3) Reinicia y elige "Futurista" en tu perfil → Tema.

Futurista:
  primary-color: "#4de2ff"
  accent-color: "#ff9f0a"
  primary-background-color: "#070b12"
  secondary-background-color: "#0e1522"
  lovelace-background: "#070b12"
  card-background-color: "#0e1522"
  ha-card-background: "#0e1522"
  ha-card-border-radius: "24px"
  ha-card-border-color: "#1d3552"
  primary-text-color: "#e8f1ff"
  secondary-text-color: "#8fa3bf"
  app-header-background-color: "#070b12"
  app-header-text-color: "#e8f1ff"
  sidebar-background-color: "#0a0f18"
  sidebar-text-color: "#e8f1ff"
  sidebar-icon-color: "#8fa3bf"
  sidebar-selected-icon-color: "#4de2ff"
  divider-color: "#1d3552"
  state-icon-color: "#4de2ff"
