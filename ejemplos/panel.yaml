# =====================================================================
# Panel "Futurista" (Opción E)
# Pegar en: Ajustes → Paneles → (tu panel) → lápiz → ⋮ → Editor de configuración RAW
# Las líneas marcadas con  # CAMBIAR  llevan entidades que tienes que reemplazar
# por las tuyas (Herramientas para desarrolladores → Estados para ver los IDs).
# =====================================================================

views:
  - title: Inicio
    path: inicio
    icon: mdi:home
    type: sections
    max_columns: 4
    background: "#070b12"
    sections:
      - type: grid
        column_span: 4
        cards:

          # ---------- CABECERA CON CHIPS DE ESTADO ----------
          - type: custom:futurista-estado-card
            titulo: Hola Familia
            subtitulo: Martinengo
            chips:
              - entity: binary_sensor.nexxt_one_2430jekvt_estado_wan
                nombre: Internet
                estados_ok: ["on"]
              - entity: sensor.roborock_bateria          # CAMBIAR
                nombre: Roborock
                alerta_bajo: 20
              - entity: sensor.asustor_cpu               # CAMBIAR
                nombre: NAS CPU
                alerta_sobre: 90
            grid_options:
              columns: full
              rows: 1

          # ---------- CLIMA (izquierda, grande) ----------
          - type: custom:futurista-clima-card
            entity: weather.forecast_casa
            nombre: Martinengo
            horas: 6
            grid_options:
              columns: 28
              rows: 8

          # ---------- RELOJ (derecha arriba) ----------
          - type: custom:futurista-reloj-card
            grid_options:
              columns: 20
              rows: 3

          # ---------- ROBOROCK + BOTONES (derecha abajo) ----------
          - type: custom:futurista-roborock-card
            nombre: Roborock
            entity: vacuum.roborock                      # CAMBIAR
            bateria: sensor.roborock_bateria             # CAMBIAR (opcional)
            columnas: 3
            botones:
              - nombre: Aspirar
                icono: mdi:robot-vacuum
                accion: vacuum.start
                target:
                  entity_id: vacuum.roborock             # CAMBIAR
              - nombre: Baño
                icono: mdi:bathtub-outline
                accion: script.turn_on
                target:
                  entity_id: script.limpiar_bano         # CAMBIAR
              - nombre: Base
                icono: mdi:home-import-outline
                accion: vacuum.return_to_base
                target:
                  entity_id: vacuum.roborock             # CAMBIAR
              - nombre: Calor
                icono: mdi:heat-wave
                entity: switch.calefaccion               # CAMBIAR (se prende/apaga al tocar)
              - nombre: Caldera
                icono: mdi:water-boiler
                entity: switch.caldera                   # CAMBIAR
              - nombre: Vaciar
                icono: mdi:delete-empty-outline
                accion: button.press
                target:
                  entity_id: button.roborock_vaciar      # CAMBIAR
            grid_options:
              columns: 20
              rows: 5

          # ---------- MÚSICA ----------
          - type: custom:futurista-musica-card
            entity: media_player.echo_pop_spotify
            grid_options:
              columns: 20
              rows: 5

          # ---------- RED ----------
          - type: custom:futurista-red-card
            nombre: Red
            conexion: binary_sensor.nexxt_one_2430jekvt_estado_wan
            descarga: sensor.nexxt_one_2430jekvt_velocidad_de_descarga
            subida: sensor.nexxt_one_2430jekvt_velocidad_de_subida
            dispositivos: sensor.nexxt_dispositivos
            nombres:
              unknown-78: ASUSTOR
              roborock: Roborock
            iconos:
              unknown-78: mdi:nas
              roborock: mdi:robot-vacuum
              matias-lizzy: mdi:laptop
              tb330: mdi:tablet
              samsung: mdi:cellphone
            grid_options:
              columns: 16
              rows: 5

          # ---------- NAS ----------
          - type: custom:futurista-nas-card
            nombre: ASUSTOR
            medidores:
              - entity: sensor.asustor_cpu               # CAMBIAR
                nombre: CPU
              - entity: sensor.asustor_ram               # CAMBIAR
                nombre: RAM
                max: 1024                                # RAM total en MB, para calcular el %
              - entity: sensor.asustor_disco_usado       # CAMBIAR
                nombre: Disco
            filas:
              - entity: sensor.asustor_uptime            # CAMBIAR (opcional)
                nombre: Encendido
            grid_options:
              columns: 12
              rows: 5
